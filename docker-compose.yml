services:
  octocatalog:
    build: .
    image: ghcr.io/its-the-vibe/octocatalog:latest
    pull_policy: always
    read_only: true
    ports:
      - "${PORT:-8080}:8080"    
    environment:
      - PORT=8080
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - CONFIG_FILE=/catalog.json
    volumes:
      - ./catalog.json:/catalog.json:ro
    restart: on-failure:10
